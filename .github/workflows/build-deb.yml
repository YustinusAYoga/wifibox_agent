name: Build Debian Package for Raspberry Pi (32-bit armhf)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build-armhf:
    name: Build armhf Deb
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Compile and Package inside 32-bit ARM Container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:22.04 \
            /bin/bash -c "apt-get update && apt-get install -y dpkg-dev cython3 gcc python3-dev && chmod +x build-deb.sh && ./build-deb.sh armhf"

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifibox-agent_armhf
          path: "*.deb"
          retention-days: 7
