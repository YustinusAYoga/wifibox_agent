name: Build Debian Package for Raspberry Pi

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build-arm64:
    name: Build arm64 Deb
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Compile and Package inside ARM64 Ubuntu Container
        uses: addnab/docker-run-action@v3
        with:
          image: arm64v8/ubuntu:22.04
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            # Update apt and install dependencies inside the ARM container
            apt-get update
            apt-get install -y dpkg-dev cython3 gcc python3-dev
            
            # Make the build script executable and run it, passing arm64
            chmod +x build-deb.sh
            ./build-deb.sh arm64

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifibox-agent_arm64.deb
          path: "*.deb"
          retention-days: 7
